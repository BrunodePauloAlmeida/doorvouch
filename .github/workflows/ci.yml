name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    # Proves that the rule, the storage and the command line need nothing but
    # the standard library: only pytest is installed here.
    name: Logic on the standard library alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest 2>&1 | tee job.log
      - name: TEMPORARY - show the output when a step failed
        if: failure()
        run: |
          text=$(tail -n 60 job.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=core output::${text}"

  full:
    name: Lint, types and all tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install the system libraries OpenCV and MediaPipe need
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgl1 libegl1 libgles2
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked 2>&1 | tee job.log
      - run: uv run ruff check --output-format=github . 2>&1 | tee job.log
      - run: uv run ruff format --check . 2>&1 | tee job.log
      - run: uv run mypy 2>&1 | tee job.log
      - run: uv run pytest 2>&1 | tee job.log
      - name: TEMPORARY - show the output when a step failed
        if: failure()
        run: |
          text=$(tail -n 60 job.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=output on ${RUNNER_OS}::${text}"

  models:
    # What no unit test can show: the published model files still match their
    # checksums, load on Linux and on Windows, and see what they should in
    # MediaPipe's public sample photos.
    name: Real models on sample photos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOORVOUCH_SAMPLES: data/samples
      DOORVOUCH_REQUIRE_REAL_MODELS: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install the system libraries OpenCV and MediaPipe need
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgl1 libegl1 libgles2
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked 2>&1 | tee job.log
      - name: Reuse the model files and sample photos of an earlier run
        uses: actions/cache@v5
        with:
          path: data
          key: real-data-${{ runner.os }}-${{ hashFiles('src/doorvouch/models.py', '.github/workflows/ci.yml') }}
      - run: uv run doorvouch models download 2>&1 | tee -a job.log
      - run: uv run doorvouch doctor --no-camera 2>&1 | tee -a job.log
      - name: Fetch the sample photos
        run: |
          mkdir -p data/samples
          for name in thumbs_up pointing_up victory; do
            test -s "data/samples/${name}.jpg" || curl --fail --silent --show-error --location \
              --output "data/samples/${name}.jpg" \
              "https://storage.googleapis.com/mediapipe-tasks/gesture_recognizer/${name}.jpg"
          done
      - run: uv run pytest tests/test_real_models.py -v 2>&1 | tee -a job.log
      - name: TEMPORARY - show the output
        if: always()
        run: |
          text=$(grep -v -E '^(W0000|I0000|INFO: |WARNING: Logging)' job.log | tail -n 75 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }' || true)
          echo "::notice title=real models on ${RUNNER_OS}::${text}"
